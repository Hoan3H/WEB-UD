<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng ký - Gundam 3H Shop</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/style-client.css"></head>
<body><main class="auth-page"><a class="auth-brand" href="index.html">Gundam 3H Shop</a><section class="auth-card"><h1>Đăng ký tài khoản</h1><p>Thông tin mẫu đã được điền sẵn, không có ràng buộc nhập liệu.</p><form action="index-logged-in.html" method="get" class="auth-form" novalidate><label for="register-name">Họ và tên<input type="text" id="register-name" name="name" value="Nguyễn Minh An"></label><label for="register-email">Email<input type="email" id="register-email" name="email" value="minhan@example.com"></label><label for="register-phone">Số điện thoại<input type="tel" id="register-phone" name="phone" value="0901 234 567"></label><label for="register-password">Mật khẩu<input type="password" id="register-password" name="password" value="123456"></label><label for="register-confirm">Nhập lại mật khẩu<input type="password" id="register-confirm" name="confirm-password" value="123456"></label><button type="submit">Đăng ký</button></form><p>Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a></p><a class="auth-back" href="index.html">← Về trang chủ</a></section></main></body>
</html>
